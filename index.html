<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrestonTrollz | Socials</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      cursor: none; /* custom cursor */
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #0b1117, #05080c);
      color: #fff;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 18px;
      height: 18px;
      border: 2px solid #00eaff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
      z-index: 9999;
      box-shadow: 0 0 12px #00eaff;
    }

    .cursor.active {
      transform: translate(-50%, -50%) scale(1.6);
      background: rgba(0, 234, 255, 0.3);
    }

    /* Mobile safe-area fix */
    @supports (-webkit-touch-callout: none) {
      body {
        min-height: -webkit-fill-available;
      }
    }

    .card {
      background: rgba(10, 15, 22, 0.75);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    /* Animated Glow Ring */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      border-radius: 50%;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00eaff, #0077ff, #00eaff);
      filter: blur(8px);
      animation: glow 3s linear infinite;
    }

    @keyframes glow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      opacity: 0.75;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Buttons + Ripple */
    .link-btn {
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00cfff, #005eff);
      padding: 15px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.9);
    }

    .link-btn span {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 600ms linear;
      background: rgba(255, 255, 255, 0.5);
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    footer {
      margin-top: 26px;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor"></div>

  <div class="card">

    <!-- Avatar -->
    <div class="avatar-wrapper">
      <img src="https://via.placeholder.com/200" alt="Avatar" class="avatar">
    </div>

    <h1>PrestonTrollz</h1>
    <p class="tagline">Content Creator • Gaming • Roleplay</p>

    <div class="links">
      <a href="https://www.youtube.com/@PrestonTrollz" target="_blank" class="link-btn">🎥 YouTube</a>
      <a href="https://kick.com/prestontrollz" target="_blank" class="link-btn">🎮 Kick</a>
      <a href="https://discord.gg/AwSBvfgugC" target="_blank" class="link-btn">💬 Discord</a>
    </div>

    <footer>
      © 2026 PrestonTrollz • All Rights Reserved
    </footer>

  </div>

  <!-- Click Sound -->
  <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-modern-click-box-check-1120.mp3"></audio>

  <!-- JS -->
  <script>
    const cursor = document.querySelector('.cursor');
    const clickSound = document.getElementById('clickSound');

    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    document.querySelectorAll('.link-btn').forEach(button => {
      button.addEventListener('mouseenter', () => cursor.classList.add('active'));
      button.addEventListener('mouseleave', () => cursor.classList.remove('active'));

      button.addEventListener('click', function (e) {
        clickSound.currentTime = 0;
        clickSound.play();

        const circle = document.createElement('span');
        const diameter = Math.max(this.clientWidth, this.clientHeight);
        const radius = diameter / 2;

        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - this.getBoundingClientRect().left - radius}px`;
        circle.style.top = `${e.clientY - this.getBoundingClientRect().top - radius}px`;

        this.querySelector('span')?.remove();
        this.appendChild(circle);
      });
    });
  </script>

</body>
</html>
