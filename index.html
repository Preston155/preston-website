<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrestonTrollz | Socials</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 35px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00eaff;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 25px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-btn {
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00eaff, #0077ff);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card {
        margin: 15px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Replace src with your image -->
    <img src="https://via.placeholder.com/200" alt="Avatar" class="avatar">

    <h1>PrestonTrollz</h1>
    <p class="tagline">Content Creator • Gaming • Roleplay</p>

    <div class="links">
      <!-- Replace the # with your real links -->
      <a href="#" target="_blank" class="link-btn">🎥 YouTube</a>
      <a href="#" target="_blank" class="link-btn">🎮 Kick</a>
      <a href="#" target="_blank" class="link-btn">💬 Discord</a>
      <a href="#" target="_blank" class="link-btn">📸 Instagram</a>
      <a href="#" target="_blank" class="link-btn">🎵 TikTok</a>
    </div>

    <footer>
      © 2026 PrestonTrollz • All Rights Reserved
    </footer>
  </div>

</body>
</html>
