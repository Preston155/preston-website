<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrestonTrollz | Socials</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
    }

    /* Mobile safe-area fix */
    @supports (-webkit-touch-callout: none) {
      body {
        min-height: -webkit-fill-available;
      }
    }

    .card {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 35px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* 🔥 Animated Glow Ring */
    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00eaff, #0077ff, #00eaff);
      filter: blur(6px);
      animation: glow 3s linear infinite;
      z-index: 0;
    }

    @keyframes glow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 26px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 🔘 Buttons + Ripple */
    .link-btn {
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #00eaff, #0077ff);
      padding: 14px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.6);
    }

    .link-btn span {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 600ms linear;
      background: rgba(255, 255, 255, 0.6);
    }

    @keyframes ripple {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .card {
        margin: 15px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- Avatar -->
    <div class="avatar-wrapper">
      <img src="https://via.placeholder.com/200" alt="Avatar" class="avatar">
    </div>

    <h1>PrestonTrollz</h1>
    <p class="tagline">Content Creator • Gaming • Roleplay</p>

    <div class="links">
      <a href="https://www.youtube.com/@PrestonTrollz" target="_blank" class="link-btn">🎥 YouTube</a>
      <a href="https://kick.com/prestontrollz" target="_blank" class="link-btn">🎮 Kick</a>
      <a href="https://discord.gg/AwSBvfgugC" target="_blank" class="link-btn">💬 Discord</a>
    </div>

    <footer>
      © 2026 PrestonTrollz • All Rights Reserved
    </footer>

  </div>

  <!-- Ripple JS -->
  <script>
    document.querySelectorAll('.link-btn').forEach(button => {
      button.addEventListener('click', function (e) {
        const circle = document.createElement('span');
        const diameter = Math.max(this.clientWidth, this.clientHeight);
        const radius = diameter / 2;

        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${e.clientX - this.getBoundingClientRect().left - radius}px`;
        circle.style.top = `${e.clientY - this.getBoundingClientRect().top - radius}px`;

        this.querySelector('span')?.remove();
        this.appendChild(circle);
      });
    });
  </script>

</body>
</html>
